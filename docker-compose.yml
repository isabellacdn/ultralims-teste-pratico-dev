services:
  mysql:
    image: mysql:8.0
    container_name: ultralims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ultralims
      MYSQL_USER: ultralims
      MYSQL_PASSWORD: ultralims
    ports:
      # host:container — a 3306 do container aparece como 3307 na minha maquina
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
